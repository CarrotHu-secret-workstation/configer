<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>configer 演示 — Pyodide WebAssembly</title>
  <link rel="stylesheet" href="style.css">
  <!-- Pyodide：从 jsDelivr CDN 加载（Python 3.12） -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⚙</span>
      <span class="title">configer 演示</span>
      <span class="subtitle">语义模型 · 适配器 · 浏览器内实时运行</span>
    </div>
    <div class="status" id="status">
      <span class="dot"></span>
      <span id="status-text">加载 Pyodide …</span>
    </div>
  </header>

  <section class="toolbar">
    <label>示例
      <select id="sample-select">
        <option value="">— 选择一个示例 —</option>
        <optgroup label="YAML">
          <option value="yaml-robot">机器人参数（带分组/枚举/范围）</option>
          <option value="yaml-camera">相机配置（只读容器）</option>
          <option value="yaml-floats">浮点风格保留（trailing_dot/fixed）</option>
        </optgroup>
        <optgroup label="Python">
          <option value="py-dronectrl">droneCtrl 配置（带 @ 标注）</option>
          <option value="py-compute">compute 模块（异体数字字面量只读）</option>
        </optgroup>
      </select>
    </label>
    <label>格式
      <select id="format-select">
        <option value="auto">自动嗅探</option>
        <option value="yaml">YAML</option>
        <option value="python">Python</option>
      </select>
    </label>
    <button id="btn-load">载入源码 → 模型</button>
    <button id="btn-clear" class="ghost">清空</button>
  </section>

  <main class="grid">
    <!-- 左侧：源码 -->
    <section class="panel source-panel">
      <header class="panel-head">
        <h2>源码（输入）</h2>
        <span class="hint" id="byte-count">0 字节</span>
      </header>
      <textarea id="source" spellcheck="false" placeholder="选择上方示例，或在此粘贴 YAML / Python 配置 …"></textarea>
    </section>

    <!-- 右侧：语义模型 -->
    <section class="panel model-panel">
      <header class="panel-head">
        <h2>语义模型 <span class="badge" id="doc-format">—</span></h2>
        <span class="hint" id="item-count">0 项 / 0 组</span>
      </header>
      <div id="model-view" class="model-view">
        <p class="empty">尚未载入。点击「载入源码 → 模型」开始。</p>
      </div>
    </section>
  </main>

  <!-- 编辑：施加 EditOp -->
  <section class="edit-bar">
    <div class="edit-fields">
      <label>修改条目
        <select id="edit-path"><option>—</option></select>
      </label>
      <label>新值
        <input id="edit-value" type="text" placeholder="新值（按条目 type 解析）">
      </label>
    </div>
    <button id="btn-apply">应用编辑（生成新字节流）</button>
    <span class="hint" id="edit-hint"></span>
  </section>

  <!-- 诊断 -->
  <section class="panel diag-panel">
    <header class="panel-head">
      <h2>诊断</h2>
      <span class="hint" id="diag-count">0 条</span>
    </header>
    <ul id="diag-list" class="diag-list">
      <li class="empty">无</li>
    </ul>
  </section>

  <!-- 写回结果预览 -->
  <section class="panel writeback-panel" id="writeback-panel" hidden>
    <header class="panel-head">
      <h2>写回结果（新字节流）</h2>
      <span class="hint" id="writeback-meta"></span>
    </header>
    <pre id="writeback-output"></pre>
  </section>

  <footer class="foot">
    <span>引擎在浏览器中真实运行：<code>libcst</code> + <code>ruamel.yaml</code> 通过 Pyodide WASM 加载</span>
    <a href="https://github.com/CarrotHu-secret-workstation/configer" target="_blank" rel="noopener">源代码 ↗</a>
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
