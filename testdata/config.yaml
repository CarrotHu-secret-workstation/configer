brain_node:
  ros__parameters:
    game:
      team_id: 66 # consistant with GameControl
      player_id: 3 # 1 | 2 | 3 | 4 | 5
      field_type: "adult_size" # adult_size | kid_size | robo_league
      player_role: "striker" # striker | goal_keeper
      player_start_pos: "right" # right | left
      treat_person_as_robot: false # 是否将人类视为机器人, 用于调试. !!!! 正式比赛时, 必须设置为 false !!!!
      number_of_players: 5
    
    ball_predictor: 
      step_interval: 100. 
      step_cnt: 50 
      linear_steps: 5 
      linear_rsq_threshold: 0.98 
      acceleration: -0.4 
      
    robot:
      robot_height: 0.90 
      odom_factor: 1.2 
      vx_factor: 0.90 
      yaw_offset: 0.0 
      vx_limit: 1.2 
      vy_limit: 0.5 
      vtheta_limit: 1.5 

    strategy:
      ball_confidence_threshold: 30.0 
      ball_confidence_decay_rate: 3.0 
      enable_stable_kick: false 
      ball_memory_timeout: 3.0 
      tm_ball_dist_threshold: 1.5  
      limit_near_ball_speed: false 
      near_ball_speed_limit: 0.6 
      near_ball_range: 2.0 
      soft_kickoff: false 
      soft_kickoff_speed: 0.3 
      kick_range: 1.0 
      kick_theta_range: 0.2 
      abort_kick_when_ball_moved: true 
      abort_kick_ball_move_threshold: 0.3 
      abort_shoot_when_ball_moved: true  
      limit_speed_near_border: false 
      near_border_speed_limit: 0.5
      near_border_dist_threshold: -1.0 
      enable_bypass: false 
      enable_shoot: false 
      enable_directional_kick: false 
      use_squat_block: true 
      squat_block_msecs: 2000.0 
      use_move_block: false 
      move_block_msecs: 2000.0 
      shoot:
        threat_threshold: -2.0 
        xmin: 0.3
        xmax: 0.6
        ymin: -0.3
        ymax: 0.3

      power_shoot:
        enable: false 
        use_for_kickoff: false 
        xmin: 1.1 
        xmax: 1.5 
        ymin: -0.3 
        ymax: 0.3 
      enable_auto_visual_kick: true
      auto_visual_kick_enable_dist_min: 0.2
      auto_visual_kick_enable_dist_max: 4.0
      auto_visual_kick_enable_angle: 0.8
      enable_auto_visual_defend: false 
      cooperation:
        enable_role_switch: true 
        ball_control_cost_threshold: 5.0 

      cost_gain: 1.0  # cost 数值调节系数: 内部算出的 cost 乘以这个系数, 用于决策 (lead 判定/rank/Assist) 和队友 UDP 通信. >1 表示更"害怕"cost (更难当 lead), <1 表示更激进 (更容易当 lead). 改这个值不需要重新编译. 
      far_set_play_search:
        enable: true                 # 任一方门球/角球很远且看不到球时，先去球应出现的半场搜索; 同时门控 gameControlCallback 的 gc_opponent_set_play_search_direction 计算
        trigger_x: 0.5               # 越过中线至少 0.5 m 才算进入目标半场，避免在中线附近反复切换
        field_target_x_ratio: 0.25   # 场上机器人搜索目标 |x| = 场长 * 此比例
        lane_y_ratio: 0.28           # 按 player_id 分配横向搜索通道
        max_move_secs: 30.0
        vx_limit: 0.7
        vy_limit: 0.4

    obstacle_avoidance:
      depth_sample_step: 16 
      obstacle_min_height: 0.3 
      grid_size: 0.2 
      max_x: 3.0 
      max_y: 5.0 
      exclusion_x: 0.4 
      exclusion_y: 0.5 
      ball_exclusion_radius: 0.0 
      ball_exclusion_height: 0.3 
      occupancy_threshold: 20 
      collision_threshold: 0.3 
      safe_distance: 1.0 
      avoid_secs: 2.0 
      enable_freekick_avoid: true 
      freekick_start_placing_safe_distance: 0.5 
      freekick_start_placing_avoid_secs: 1.5 
      obstacle_memory_msecs: 500. 
      avoid_during_kick: false 
      kick_ao_safe_dist: 1.5 
      kick_ao_use_shoot: false 
      avoid_during_chase: true 
      chase_ao_safe_dist: 1.5 
      always_turn_left: false 

    locator:
      min_marker_count: 4
      max_residual: 0.4

    # RL Brain (obs_v1 观测 + 规则过滤器 + PolicyNP 推理), readapt_v2 契约, 见 _reports/readapt_v2_spec.md
    # 字段含义见 include/rl_observation.h / rule_filter.h / rl_policy.h / rl_policy_np.h
    # 启用方式: enabled: true 且 launch 时指定 tree:=game_rl.xml (规则过滤器行为树, 原 game.xml 保持不变)
    # 旧键归档说明 (readapt_v2 §3-D): policy_path(指向 rlbrain_ts.pt 的 TorchScript 路径) 已被 weights(.bin) 取代;
    #   ball_vel_window/ball_vel_max 已被 ball_vel.{alpha,spike_max,teleport_max,stale_hold} 新滤波器参数取代;
    #   旧 TorchScript 资产移入 scripts/rl_brain/_archive_torchscript/, 未删除.
    rl_brain:
      enabled: false # RL 动作总开关: false=绝不向底盘/踢球发 verb (经典树照常); true=RLDecide 发 verb
      shadow: true # 影子模式 (readapt_v2 R5): enabled=false 且 shadow=true 时照常跑观测(+权重已载则推理), RL 建议动作写 rerun rl_shadow/*, 但绝不发 verb
      backend: "policy_np" # 推理后端: policy_np(C++ 移植, 零新依赖, 默认) | libtorch | onnx | stub(安全停车) —— 旧 libtorch/.pt 契约过期, 待 5v5 再评估
      weights: "scripts/rl_brain/assets/r3-continue/rlbrain_np.bin" # PolicyNP 权重二进制 (格式见 readapt_v2_spec.md §2, 35 张量小端); 取代旧 policy_path
      stochastic: false # false=确定性提取 (move tanh(mu)·fs, gate=argmax); true=采样模式 (mu+softplus(logstd)·N, Categorical gate), 仅调试
      our_robots: 3 # 契约覆盖球员数 (obs_v1 = 3v3 契约); own_pid > our_robots 时 RLDecide 返回 FAILURE 交回经典树 (5v5 预案)
      row_pid_base: 1 # 行选择: row = own_pid - row_pid_base (行 i ↔ pid i+1, 见 spec §1.6)
      kickoff_window_s: 10 # READY/开球相位 timer 上限 (秒), 与权重文件头字段一致 (spec §1.2)
      set_play_window_s: 45 # 定位球相位 timer 锁存上限 (秒), 与权重文件头字段一致 (spec §1.2)
      opp_set_play_buffer_m: 1.65 # 对方定位球缓冲 (米): 距球小于此值者目标替换为沿球→机方向退出的 P 速度 (增益 1.5 上限 2.0), 面朝球, 禁踢
      sdk_kick_power_min: 1.0 # kick power 地板 (SDK: power<1 非法), kickBall 前 clamp [sdk_kick_power_min, 10]
      mirror: "off" # team1 镜像: off=关 (默认, 真机定位已是队伍相对系) | auto=旧自动逻辑 | true=强制镜像 (仿真容器联调)
      infer_decimation: 3 # 推理节流: 100Hz tick 每 N 拍推一次 (N=3 约 30Hz), 其余拍沿用上次动作
      kick_range: 0.41 # 起脚判定半径 (米), 与训练侧 sim kick_range = max(0.35, r_robot+r_ball+0.05) 对齐
      kick_timeout: 1.0 # 起脚 windup 超时 (秒): 超时自动 release(cancel) 清除 _kickActive, 对齐训练侧 sim kick_timer 时限 (>= 最大 t_kick 约 0.8s)
      field_half_length: 7.0 # 场地半长 (米), 位置截断用, 对齐归一化基准 field_scale (7, 4.5)
      field_half_width: 4.5 # 场地半宽 (米)
      opponent_theta_mode: "zero" # 对方朝向策略: zero=填0 (vision 无对方朝向); motion=预留, 未来用运动方向估计
      own_color: "" # 我方队服颜色 red|blue|空=未知, 用于从 vision Opponent 检测中按颜色分拣敌我
      goalie_mode: "rl" # 点球守门员模式: rl=守门员也走 RLDecide | classic=保留 GoalKeeperPenaltyKick 经典子树
      keep_distance_radius: 1.65 # 对方定位球/开球避让半径 (米), readapt_v2 起 1.5→1.65 与 opp_set_play_buffer_m 对齐; 对方点球自动用 2.1
      ball_vel: # 球速估计滤波器 (spec §1.3, rl_observation 消费)
        alpha: 0.5 # 低通系数: lp = alpha·v_raw + (1-alpha)·lp
        spike_max: 8.0 # |v_raw| 超过此值 (m/s) 判 teleport, 滤波器清零 (不入低通)
        teleport_max: 1.0 # 单帧球位移超过此值 (米) 判 teleport, 滤波器清零
        stale_hold: 0.5 # 球丢失时保持最后速度值的时长 (秒), 超时后 vel=0

    enable_com: True  # 是否开启队友间通信，建议打开

    rerunLog:
      enable_tcp: false # 是否通过网络传输 log
      server_ip: "192.168.10.110:9876" # 开启了 rerun Viewer 的机器地址
      enable_file: false # 是否将 log 写入本地
      log_dir: "/home/booster/Workspace/rrlog" # 本地 log 存储路径, 会在此路径下生成以时间为开头的文件
      max_log_file_mins: 5.0 # 本地 log 最长多少分钟就分片存储. 太大的文件会导致读的时候死机.
      img_interval: 1 #每多少帧图像 log 一次, 如果希望更好的实时性或减少日志大小, 可以调高这个值. 但会造成 log 的时间精度降低.
    
    recovery:
      retry_max_count: 2

    vision:
      image_topic: "/boostercamera/head/rgb" #realsense
      depth_image_topic: "/boostercamera/head/depth" #realsense
      # image_topic: "/image_left_raw" # d-robotics
      # depth_image_topic: "/image_left_raw/camera_info" # d-robotics
      # cam_pixel_width: 544. # 相机像素宽度, d-robotics
      # cam_pixel_height: 448. # 相机像素高度, d-robotics
      cam_pixel_width: 1280. # 相机像素宽度 realsense
      cam_pixel_height: 720. # 相机像素高度 realsense
      cam_fov_x: 90.0 # 相机视场角, 单位: 度 realsense
      cam_fov_y: 60.0 # 相机视场角, 单位: 度 realsense
      # cam_fov_x: 69.4 # 相机视场角, 单位: 度, d-robotics
      # cam_fov_y: 42.5 # 相机视场角, 单位: 度, d-robotics    

    debug:
      log_ball_pos: false # 是否记录球位置到 ballpos.log 中, 用于调试
    
    game_control_ip: "192.168.74.2"  # 更改为具体的裁判机的 IP 地址

    # for fun
    sound:
      enable: true 
      sound_pack: "espeak" 
