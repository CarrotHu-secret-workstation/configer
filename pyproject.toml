[project]
name = "configer"
version = "0.1.0"
description = "配置文件 GUI 编辑器：语义模型 + 适配器（规范 docs/spec.md v0.4）"
requires-python = ">=3.10"
dependencies = [
    "libcst",
    "ruamel.yaml",
    "nicegui",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
configer = "configer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/configer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
